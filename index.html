<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartu Profil</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      width: 300px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-top: 10px;
      object-fit: cover;
    }

    .card h2 {
      margin: 15px 0 5px;
    }

    .card p {
      color: #666;
      font-size: 14px;
    }

    .card .button {
      margin-top: 15px;
      display: inline-block;
      padding: 10px 20px;
      background-color: #6200ea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .card .button:hover {
      background-color: #3700b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://via.placeholder.com/100" alt="Foto Profil">
    <h2>Nama Anda</h2>
    <p>Web Developer | Content Creator</p>
    <a href="#" class="button">Hubungi Saya</a>
  </div>

</body>
</html>
